name: Manual iOS Build (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Clean everything
      run: |
        flutter clean
        rm -rf ios/Flutter/Generated.xcconfig
        rm -rf ios/Pods
        rm -rf ios/Podfile.lock
    
    - name: Get packages
      run: flutter pub get
    
    - name: Generate files
      run: |
        flutter gen-l10n 2>/dev/null || echo "No l10n setup"
        flutter precache --ios
    
    - name: Verify Generated.xcconfig exists
      run: |
        if [ ! -f "ios/Flutter/Generated.xcconfig" ]; then
          echo "Generated.xcconfig not found, forcing regeneration..."
          flutter build ios --no-codesign --debug
        fi
        ls -la ios/Flutter/
    
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        cd ..
    
    - name: Build iOS (unsigned)
      run: flutter build ios --release --no-codesign
    
    - name: Create IPA
      run: |
        mkdir -p build/ios/ipa/Payload
        cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
        cd build/ios/ipa
        zip -r -9 ../absensi_app.ipa Payload/
        cd ../../..
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: absensi_app-unsigned
        path: build/ios/absensi_app.ipa